[project]
name = "forecast"
version = "0.1.0"
description = "IRPC arrival forecast from OPA planting reports (TRD M8)"
authors = [
    { name = "Andrian Lloyd Maagma", email = "110181829+andrianllmm@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
